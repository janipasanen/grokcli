[package]
name = "grokcli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.89"
clap = { version = "4.5.40", features = ["derive"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.23.0"
